context:
  version: "1.2.0"

package:
  name: pyrefly
  version: ${{ version }}

source:
  url: https://github.com/facebook/pyrefly/archive/refs/tags/${{ version }}.tar.gz
  sha256: 39c3d391da0aa85eb7d0149fc57e860495f50e431f4911547f21906a35ab33bd

build:
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      # Tell `pixi global` to not set CONDA_PREFIX during activation
      # https://pixi.sh/dev/global_tools/introduction/#opt-out-of-conda_prefix
      - if: win
        then:
          - if not exist "%PREFIX%\\etc\\pixi\\pyrefly" mkdir "%PREFIX%\\etc\\pixi\\pyrefly"
          - type nul > "%PREFIX%\\etc\\pixi\\pyrefly\\global-ignore-conda-prefix"
        else:
          - mkdir -p "${PREFIX}/etc/pixi/pyrefly"
          - touch "${PREFIX}/etc/pixi/pyrefly/global-ignore-conda-prefix"
      - cd pyrefly
      # `cargo install` ignores the `CARGO_BUILD_TARGET` set by the rust activation,
      # so the target triple has to be passed explicitly to cross compile.
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --target ${CARGO_BUILD_TARGET} --root ${{ PREFIX }} --path .
        else:
          - cargo auditable install --locked --no-track --bins --target %CARGO_BUILD_TARGET% --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml
  number: 1

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cargo-auditable
    # no `make` on win-arm64, and nothing in the build actually invokes it there
    - if: not win
      then: make

tests:
  - script: pyrefly --help
  - package_contents:
      files:
        - etc/pixi/pyrefly/global-ignore-conda-prefix
      bin:
        - pyrefly
      strict: true

about:
  homepage: http://pyrefly.org
  summary: A fast type checker and IDE for Python
  description: |
    Pyrefly is a fast type checker for Python. It's designed to replace the existing Pyre type checker at Meta by the end of 2025. This README describes basic usage. See the Pyrefly website for full documentation and a tool for checking code.
  license: MIT
  license_file:
    - LICENSE
    - pyrefly/THIRDPARTY.yml
  documentation: https://pyrefly.org/en/docs/
  repository: https://github.com/facebook/pyrefly

extra:
  recipe-maintainers:
    - pavelzw
