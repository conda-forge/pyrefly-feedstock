context:
  version: "1.3.0"

package:
  name: pyrefly
  version: ${{ version }}

source:
  url: https://github.com/facebook/pyrefly/archive/refs/tags/${{ version }}.tar.gz
  sha256: f26552aae8957d6924319034eadd69830f2442685fc4e696c97e777c827a4082
  patches:
    # https://github.com/facebook/pyrefly/pull/4884
    - 0001-completion.patch

build:
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      # Tell `pixi global` to not set CONDA_PREFIX during activation
      # https://pixi.sh/dev/global_tools/introduction/#opt-out-of-conda_prefix
      - if: win
        then:
          - if not exist "%PREFIX%\\etc\\pixi\\pyrefly" mkdir "%PREFIX%\\etc\\pixi\\pyrefly"
          - type nul > "%PREFIX%\\etc\\pixi\\pyrefly\\global-ignore-conda-prefix"
        else:
          - mkdir -p "${PREFIX}/etc/pixi/pyrefly"
          - touch "${PREFIX}/etc/pixi/pyrefly/global-ignore-conda-prefix"
      - cd pyrefly
      # `CFLAGS` & co. hold the target flags, which break cc-rs when it compiles build
      # dependencies for the build platform. The rust activation exports per-target
      # `CFLAGS_<triple>` etc., so cc-rs picks the right ones itself.
      - if: unix
        then: unset CFLAGS CPPFLAGS CXXFLAGS
      # `rust-lld` cannot handle the relocations gcc emits for power8, so link with bfd
      - if: target_platform == "linux-ppc64le"
        then: export CARGO_BUILD_RUSTFLAGS="${CARGO_BUILD_RUSTFLAGS:-} -C link-self-contained=no -C link-arg=-fuse-ld=bfd"
      # `cargo install` ignores the `CARGO_BUILD_TARGET` set by the rust activation,
      # so the target triple has to be passed explicitly to cross compile.
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --target ${CARGO_BUILD_TARGET} --root ${{ PREFIX }} --path .
        else:
          - cargo auditable install --locked --no-track --bins --target %CARGO_BUILD_TARGET% --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml
      - if: unix
        then:
          - mkdir -p $PREFIX/share/zsh/site-functions $PREFIX/share/bash-completion/completions $PREFIX/share/fish/vendor_completions.d
          - $PREFIX/bin/pyrefly completion --shell zsh > $PREFIX/share/zsh/site-functions/_pyrefly
          - $PREFIX/bin/pyrefly completion --shell bash > $PREFIX/share/bash-completion/completions/pyrefly
          - $PREFIX/bin/pyrefly completion --shell fish > $PREFIX/share/fish/vendor_completions.d/pyrefly.fish
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cargo-auditable
    # no `make` on win-arm64, and nothing in the build actually invokes it there
    - if: not win
      then: make

tests:
  - script: pyrefly --help
  - package_contents:
      files:
        - etc/pixi/pyrefly/global-ignore-conda-prefix
        - if: unix
          then:
            - share/zsh/site-functions/_pyrefly
            - share/bash-completion/completions/pyrefly
            - share/fish/vendor_completions.d/pyrefly.fish
      bin:
        - pyrefly
      strict: true

about:
  homepage: http://pyrefly.org
  summary: A fast type checker and IDE for Python
  description: |
    Pyrefly is a fast type checker for Python. It's designed to replace the existing Pyre type checker at Meta by the end of 2025. This README describes basic usage. See the Pyrefly website for full documentation and a tool for checking code.
  license: MIT
  license_file:
    - LICENSE
    - pyrefly/THIRDPARTY.yml
  documentation: https://pyrefly.org/en/docs/
  repository: https://github.com/facebook/pyrefly

extra:
  recipe-maintainers:
    - pavelzw
